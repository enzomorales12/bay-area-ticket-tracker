# Runs the price collector twice a day and saves the results back to the repo.
name: Collect ticket prices

on:
  schedule:
    - cron: "0 16 * * *"   # 8 AM Pacific (standard time)
    - cron: "0 2 * * *"    # 6 PM Pacific (standard time)
  workflow_dispatch:        # adds a "Run workflow" button so you can test it anytime

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect prices
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python collector.py

      - name: Import hand-logged prices from the Google Sheet
        env:
          PRICE_LOG_CSV_URL: ${{ secrets.PRICE_LOG_CSV_URL }}
          EVENTS_CSV_URL: ${{ secrets.EVENTS_CSV_URL }}
        run: python import_log.py

      - name: Check price alerts (dry run unless ALERTS_ENABLED is true)
        env:
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          WATCHLIST_CSV: ${{ secrets.WATCHLIST_CSV }}
        run: python alerts.py

      - name: Save data to the repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for f in data/prices.csv data/manual_prices.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -f data/alerts_sent.csv ]; then git add data/alerts_sent.csv; fi
          git commit -m "Price snapshot $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing new"
          git push
